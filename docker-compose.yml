services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: healthai_coach
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: mysql+aiomysql://root:password@mysql:3306/healthai_coach
      ADMIN_API_KEY: dev-admin-key
      ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "python scripts/wait_for_db.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  etl:
    build: .
    environment:
      DATABASE_URL: mysql+aiomysql://root:password@mysql:3306/healthai_coach
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "python scripts/wait_for_db.py && alembic upgrade head && python scripts/seed_demo_data.py"
    restart: "no"

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: healthai_coach
      MB_DB_PORT: 3306
      MB_DB_USER: root
      MB_DB_PASS: password
      MB_DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
